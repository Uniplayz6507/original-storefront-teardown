<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcade North</title>
<style>
:root{--ink:#e9f0f1;--muted:#91a4aa;--bg:#101719;--panel:#172124;--panel2:#1e2c30;--line:#2e4144;--cyan:#67e4d2;--violet:#9a8cff;--amber:#f4b860;--red:#f07f79;--r:6px;--ease:cubic-bezier(.16,1,.3,1)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.01em}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.top{height:74px;background:#0c1214;border-bottom:1px solid #253438;display:flex;align-items:center;padding:0 clamp(16px,4vw,64px);gap:26px;position:sticky;top:0;z-index:10}.brand{font-weight:900;letter-spacing:.13em;font-size:18px;white-space:nowrap}.brand b{color:var(--cyan)}.nav{display:flex;gap:20px;color:#a4b3b7}.nav button,.top button{border:0;background:none;color:inherit}.nav button:hover,.nav .active{color:var(--ink)}.search{margin-left:auto;display:flex;background:#1c292c;border:1px solid #32484c;border-radius:4px;height:38px;max-width:280px;flex:1}.search input{background:none;border:0;color:var(--ink);min-width:0;width:100%;padding:0 12px;outline:0}.search:focus-within{border-color:var(--cyan)}.iconbtn{min-width:42px;height:38px;color:var(--ink);border:0;background:#2c4a4c;border-radius:4px}.layout{max-width:1260px;margin:auto;padding:40px clamp(16px,4vw,48px) 90px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;color:var(--cyan);font-size:11px;font-weight:800}.title{font-size:clamp(32px,5vw,58px);line-height:1.05;letter-spacing:-.04em;margin:10px 0 18px;max-width:650px}.lede{color:#a9b8bb;max-width:58ch;font-size:16px}.hero{min-height:410px;display:grid;grid-template-columns:1.08fr .92fr;background:linear-gradient(120deg,#263b3c,#132126 62%,#233141);overflow:hidden;border:1px solid #3f5a5a;border-radius:var(--r);position:relative}.hero:after{content:"";position:absolute;inset:auto -14% -55% 34%;height:500px;background:radial-gradient(ellipse,#67e4d233,transparent 65%);pointer-events:none}.hero-copy{padding:clamp(28px,5vw,62px);position:relative;z-index:1}.hero-art{min-height:300px;background:linear-gradient(150deg,transparent 4%,#0f191b66 28%),radial-gradient(circle at 70% 28%,#a8fff433,transparent 18%),linear-gradient(145deg,#3a6462,#1d293d 65%,#10171a);position:relative}.hero-art:before{content:"NOVA\A//\A RIFT";white-space:pre;position:absolute;right:11%;top:16%;font-size:clamp(42px,8vw,104px);font-weight:900;line-height:.78;color:#d5fff4;letter-spacing:-.08em;text-align:right;transform:skewY(-9deg);opacity:.9}.hero-art:after{content:"";position:absolute;inset:32% 10% 0 24%;background:linear-gradient(120deg,transparent,#67e4d277 48%,transparent 49%),linear-gradient(70deg,transparent 42%,#a18cff55 43%,transparent 46%);clip-path:polygon(0 100%,58% 0,100% 100%)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.btn{border:1px solid #55706e;background:#2b4545;color:var(--ink);border-radius:4px;padding:11px 15px;font-weight:800;transition:transform .2s var(--ease),background .2s}.btn:hover{transform:translateY(-2px);background:#385859}.btn.primary{background:var(--cyan);color:#102021;border-color:var(--cyan)}.btn.primary:hover{background:#8af1e2}.btn.ghost{background:transparent;color:var(--cyan)}.section{margin-top:46px}.sectionhead{display:flex;align-items:end;justify-content:space-between;margin-bottom:15px}.section h2{font-size:22px;letter-spacing:-.02em;margin:0}.sub{color:var(--muted);font-size:13px}.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.game{background:var(--panel);border:1px solid transparent;transition:transform .2s var(--ease),border-color .2s}.game:hover{transform:translateY(-4px);border-color:#4e7473}.cover{aspect-ratio:1.55/1;display:flex;align-items:end;padding:14px;position:relative;overflow:hidden;background:#293b42}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(145deg,#ffffff13,transparent 48%,#0006)}.cover span{position:relative;z-index:1;font-weight:900;font-size:20px;letter-spacing:-.04em;max-width:80%;line-height:1}.g1{background:linear-gradient(125deg,#5e4155,#1e3547 50%,#efb75f)}.g2{background:linear-gradient(135deg,#294258,#7f6a7e 55%,#e97962)}.g3{background:linear-gradient(140deg,#1e4a43,#1f6c70 53%,#f3c46b)}.g4{background:linear-gradient(145deg,#47344e,#bc7182 60%,#f4bd8e)}.g5{background:linear-gradient(120deg,#2e3f60,#4a74b4 56%,#a1e1ef)}.g6{background:linear-gradient(135deg,#453b2c,#976b38 55%,#ecba67)}.g7{background:linear-gradient(140deg,#283c4d,#564577 54%,#b9a1e9)}.g8{background:linear-gradient(145deg,#26372c,#4f805a 55%,#c2e3a1)}.meta{padding:12px 13px}.meta strong{display:block;font-size:15px}.meta small{color:var(--muted)}.price{color:var(--cyan);font-weight:800;margin-top:8px}.shelf.scroll{grid-template-columns:repeat(4,minmax(190px,1fr))}.tag{display:inline-flex;color:#adc0c1;background:#253436;border-radius:3px;padding:4px 7px;font-size:11px;margin:3px 3px 0 0}.promo{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.promo article{padding:19px;background:linear-gradient(130deg,#213d41,#202b32);min-height:126px;border-bottom:2px solid var(--cyan)}.promo h3{margin:8px 0 4px}.muted{color:var(--muted)}.pagehead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.filters{display:flex;flex-wrap:wrap;gap:8px;padding:13px;background:#141f21;border:1px solid var(--line);margin-bottom:24px}.filters select,.filters input{background:#233235;color:var(--ink);border:1px solid #3a5254;border-radius:3px;padding:10px}.filterspace{flex:1}.detail{display:grid;grid-template-columns:1.1fr .9fr;gap:34px}.media{aspect-ratio:16/9;background:linear-gradient(120deg,#1d3440,#3d476e 54%,#da9378);position:relative;overflow:hidden}.media:before{content:"THE LAST\A SIGNAL";white-space:pre;position:absolute;inset:15% auto auto 7%;font-size:clamp(28px,5vw,70px);font-weight:900;line-height:.83;letter-spacing:-.07em;color:#fff4dc;transform:rotate(-5deg)}.media:after{content:"";position:absolute;right:7%;bottom:-18%;width:45%;height:86%;border-radius:50% 50% 0 0;background:#10171977;box-shadow:0 0 0 25px #69e4d222}.detail h1{font-size:clamp(34px,5vw,60px);line-height:.98;letter-spacing:-.06em;margin:8px 0 18px}.tabs{display:flex;border-bottom:1px solid var(--line);gap:20px;margin:24px 0 18px}.tabs button{background:none;border:0;color:var(--muted);padding:11px 0;border-bottom:2px solid transparent}.tabs button.active{color:var(--ink);border-color:var(--cyan)}.req{display:grid;grid-template-columns:1fr 1fr;gap:12px;color:#b7c4c5}.req b{display:block;color:var(--ink);font-size:12px;text-transform:uppercase;letter-spacing:.09em;margin-bottom:4px}.purchase{padding:18px;background:#1a292b;border:1px solid #3b5555;margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:15px}.pricebig{font-size:26px;font-weight:900}.cartrow{display:grid;grid-template-columns:1fr auto;gap:20px;border-bottom:1px solid var(--line);padding:18px 0;align-items:center}.total{display:flex;justify-content:space-between;font-size:22px;font-weight:900;padding-top:20px}.profile{display:grid;grid-template-columns:220px 1fr;gap:32px}.avatar{width:140px;height:140px;background:linear-gradient(135deg,var(--cyan),var(--violet));border-radius:50%;display:grid;place-items:center;color:#132224;font-size:48px;font-weight:900}.statline{display:flex;gap:30px;margin-top:22px;color:var(--muted)}.statline b{display:block;color:var(--ink);font-size:22px}.toast{position:fixed;right:22px;bottom:22px;background:#d9fff4;color:#122223;padding:13px 16px;border-radius:4px;font-weight:800;box-shadow:0 12px 30px #0005;transform:translateY(90px);opacity:0;transition:.3s var(--ease);z-index:20}.toast.show{transform:none;opacity:1}.mobilebar{display:none}
@media(max-width:820px){.top{height:64px;padding:0 15px;gap:13px}.nav{display:none}.search{order:3;max-width:none}.layout{padding-top:24px}.hero{grid-template-columns:1fr;min-height:540px}.hero-art{min-height:220px;order:-1}.hero-copy{padding:30px}.shelf,.shelf.scroll{grid-template-columns:repeat(2,1fr)}.promo{grid-template-columns:1fr}.detail{grid-template-columns:1fr}.profile{grid-template-columns:1fr}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;height:60px;background:#0c1214;border-top:1px solid var(--line);z-index:9;justify-content:space-around;align-items:center}.mobilebar button{background:none;border:0;color:var(--muted);font-size:11px}.mobilebar button.active{color:var(--cyan)}.pagehead{align-items:start;flex-direction:column}.filters{display:grid;grid-template-columns:1fr 1fr}.filterspace{display:none}.cartrow{grid-template-columns:1fr}.purchase{align-items:start;flex-direction:column}}
@media(max-width:480px){.shelf,.shelf.scroll{grid-template-columns:1fr 1fr;gap:8px}.cover span{font-size:16px}.meta{padding:9px}.title{font-size:38px}.hero-art:before{font-size:58px}.req{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.brand{font-size:15px}}
</style></head>
<body><div id="app"></div><div class="toast" id="toast"></div>
<script>
const games=[
{id:'nova',name:'Nova Rift',genre:'Action RPG',tags:['Sci-fi','Action','Solo'],platform:'Windows',score:92,price:24.99,old:39.99,cover:'g1',desc:'A neon-soaked expedition across a fractured moon where every signal is a choice. Chain movement, reroute power, and decide what gets to wake up.',hero:true},
{id:'signal',name:'The Last Signal',genre:'Narrative Adventure',tags:['Story Rich','Mystery','Atmospheric'],platform:'Windows / Mac',score:96,price:19.99,old:24.99,cover:'g2',desc:'The coast has gone quiet. Tune the last working radio, follow a map that redraws itself, and find the voice hiding under the static.'},
{id:'brine',name:'Brinewake',genre:'Cozy Survival',tags:['Cozy','Crafting','Exploration'],platform:'Windows / Linux',score:88,price:14.99,old:null,cover:'g3',desc:'Build a floating garden on a warm sea, trade with passing islands, and chart a home that keeps drifting toward the horizon.'},
{id:'wisp',name:'Wisp Motel',genre:'Puzzle Horror',tags:['Puzzle','Horror','Indie'],platform:'Windows',score:84,price:9.99,old:12.99,cover:'g4',desc:'Room 13 has no door. The night manager has no shadow. Solve a motel built from forgotten check-ins.'},
{id:'orbit',name:'Orbitfall',genre:'Tactical Strategy',tags:['Strategy','Space','Turn-Based'],platform:'Windows',score:91,price:29.99,old:null,cover:'g5',desc:'Command a tiny fleet through a collapsing system. Every turn changes the map and every crew member has a different exit plan.'},
{id:'ember',name:'Emberline',genre:'Racing',tags:['Racing','Arcade','Multiplayer'],platform:'Windows / Mac',score:79,price:11.99,old:17.99,cover:'g6',desc:'Night driving for people who miss the sun. Build a crew, tune a relic, and take the long way home.'},
{id:'hollow',name:'Hollow Weather',genre:'Strategy',tags:['Strategy','Simulation','Chill'],platform:'Windows',score:87,price:21.99,old:null,cover:'g7',desc:'Forecast storms across a living valley. Move villages, plant windbreaks, and learn what the mountains are trying to say.'},
{id:'moss',name:'Moss Circuit',genre:'Puzzle Platformer',tags:['Puzzle','Platformer','Relaxing'],platform:'Windows / Linux',score:94,price:12.49,old:null,cover:'g8',desc:'A small machine with a big garden to repair. Rewire the seasons one room at a time.'}
];
const get=(id)=>games.find(g=>g.id===id)||games[0];let state={page:'home',query:'',tag:'All',platform:'All',sort:'Featured',cart:JSON.parse(localStorage.cart||'[]'),library:JSON.parse(localStorage.library||'["signal","moss"]'),selected:'nova',tab:'Overview'};const save=()=>{localStorage.cart=JSON.stringify(state.cart);localStorage.library=JSON.stringify(state.library)};const toast=(t)=>{let x=document.querySelector('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)};
function nav(page){state.page=page;render();scrollTo(0,0)}function add(id){if(!state.cart.includes(id)){state.cart.push(id);save();toast('Added to cart')}else toast('Already in cart');render()}function card(g){return `<article class="game"><button style="padding:0;border:0;background:none;color:inherit;text-align:left;width:100%" onclick="detail('${g.id}')"><div class="cover ${g.cover}"><span>${g.name}</span></div><div class="meta"><strong>${g.name}</strong><small>${g.genre} · ${g.score}% positive</small><div class="price">$${g.price.toFixed(2)} ${g.old?`<del class="muted">$${g.old.toFixed(2)}</del>`:''}</div></div></button></article>`}
function detail(id){state.page='detail';state.selected=id;render();scrollTo(0,0)}
function header(){return `<header class="top"><button class="brand" onclick="nav('home')">ARCADE <b>NORTH</b></button><nav class="nav"><button class="${state.page==='home'?'active':''}" onclick="nav('home')">Store</button><button class="${state.page==='library'?'active':''}" onclick="nav('library')">Library</button><button class="${state.page==='profile'?'active':''}" onclick="nav('profile')">Profile</button></nav><form class="search" onsubmit="event.preventDefault();state.query=this.q.value;state.page='search';render()"><input name="q" value="${state.query}" placeholder="Search the catalog"><button class="iconbtn">⌕</button></form><button class="iconbtn" onclick="nav('cart')">Bag ${state.cart.length?`· ${state.cart.length}`:''}</button></header>`}
function home(){let featured=get('nova');return `<main class="layout"><section class="hero"><div class="hero-copy"><div class="eyebrow">Featured signal · 01 / 04</div><h1 class="title">A new kind of quiet.</h1><p class="lede">${featured.desc}</p><div class="actions"><button class="btn primary" onclick="detail('nova')">Explore Nova Rift</button><button class="btn ghost" onclick="add('nova')">Add to cart · $24.99</button></div><p class="muted" style="margin-top:22px">92% positive · Windows · Full controller support</p></div><div class="hero-art"></div></section><section class="section"><div class="sectionhead"><div><div class="eyebrow">Because you played stories</div><h2>Handpicked for your next night in</h2></div><span class="sub">View collection →</span></div><div class="shelf">${games.slice(1,5).map(card).join('')}</div></section><section class="section"><div class="sectionhead"><div><div class="eyebrow">Small worlds, loud ideas</div><h2>Under $15</h2></div><span class="sub">8 results</span></div><div class="shelf">${games.filter(g=>g.price<15).map(card).join('')}</div></section><section class="section promo"><article><div class="eyebrow">Weekend signal</div><h3>Co-op without the calendar</h3><p class="muted">Five low-commitment games for a Tuesday night.</p></article><article><div class="eyebrow">New & notable</div><h3>The weird shelf</h3><p class="muted">Motel ghosts, garden machines, and one suspicious moon.</p></article><article><div class="eyebrow">Arcade North picks</div><h3>20 games, no filler</h3><p class="muted">A tightly edited shelf for people who read the tags.</p></article></section></main>`}
function searchPage(){let tags=['All',...new Set(games.flatMap(g=>g.tags))];let list=games.filter(g=>(!state.query||`${g.name} ${g.genre} ${g.tags.join(' ')}`.toLowerCase().includes(state.query.toLowerCase()))&&(state.tag==='All'||g.tags.includes(state.tag))&&(state.platform==='All'||g.platform.includes(state.platform))).sort((a,b)=>state.sort==='Price'?(a.price-b.price):state.sort==='Rating'?(b.score-a.score):a.name.localeCompare(b.name));return `<main class="layout"><div class="pagehead"><div><div class="eyebrow">Catalog search</div><h1 class="title" style="font-size:42px">${state.query?`Results for “${state.query}”`:'Browse the signal'}</h1></div><span class="sub">${list.length} games</span></div><div class="filters"><input placeholder="Search again" value="${state.query}" oninput="state.query=this.value;render()"><select onchange="state.tag=this.value;render()">${tags.map(t=>`<option ${state.tag===t?'selected':''}>${t}</option>`).join('')}</select><select onchange="state.platform=this.value;render()"><option>All</option><option ${state.platform==='Windows'?'selected':''}>Windows</option><option ${state.platform==='Mac'?'selected':''}>Mac</option><option ${state.platform==='Linux'?'selected':''}>Linux</option></select><select onchange="state.sort=this.value;render()"><option>Featured</option><option>Rating</option><option>Price</option><option>Name</option></select></div>${list.length?`<div class="shelf">${list.map(card).join('')}</div>`:`<div style="padding:80px 0;text-align:center"><div class="eyebrow">No signal</div><h2>Nothing matched that search.</h2><p class="muted">Try a broader title, genre, or tag.</p><button class="btn primary" onclick="state.query='';state.tag='All';render()">Reset filters</button></div>`}</main>`}
function detailPage(){let g=get(state.selected);return `<main class="layout"><div class="detail"><div><div class="media"></div><div class="tabs">${['Overview','Reviews','Requirements'].map(t=>`<button class="${state.tab===t?'active':''}" onclick="state.tab='${t}';render()">${t}</button>`).join('')}</div>${state.tab==='Requirements'?`<div class="req"><div><b>Minimum</b>Windows 10, 8 GB RAM, GTX 970</div><div><b>Recommended</b>Windows 11, 16 GB RAM, RTX 2060</div><div><b>Storage</b>24 GB available space</div><div><b>Input</b>Keyboard, mouse, controller</div></div>`:state.tab==='Reviews'?`<p class="lede">“A precise little machine that knows when to get out of the way.”</p><p class="muted">${g.score}% of the ${g.score*37+142} user reviews are positive.</p><div class="promo"><article><b>Positive</b><p class="muted">“The atmosphere is doing heavy lifting, in the best way.”</p></article><article><b>Recent</b><p class="muted">“Finished at 2am. Worth the sleep debt.”</p></article></div>`:`<p class="lede">${g.desc}</p><p class="muted">A focused, generous game from an independent team. No battle pass, no daily login, no noise.</p>`}</div><div><div class="eyebrow">${g.genre}</div><h1>${g.name}</h1><p class="muted">${g.score}% positive · ${g.platform}</p><div>${g.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="purchase"><div><div class="pricebig">$${g.price.toFixed(2)}</div><small class="muted">Instant delivery · DRM-free build</small></div><button class="btn primary" onclick="add('${g.id}')">Add to cart</button></div><section class="section" style="margin-top:30px"><div class="eyebrow">More like this</div><div class="shelf" style="grid-template-columns:1fr 1fr;margin-top:13px">${games.filter(x=>x.id!==g.id).slice(0,2).map(card).join('')}</div></section></div></div></main>`}
function cartPage(){let items=state.cart.map(get);let total=items.reduce((a,g)=>a+g.price,0);return `<main class="layout"><div class="eyebrow">Your bag</div><h1 class="title" style="font-size:46px">Ready when you are.</h1>${items.length?`<div style="max-width:760px">${items.map(g=>`<div class="cartrow"><div><b>${g.name}</b><div class="muted">${g.genre}</div></div><div><b>$${g.price.toFixed(2)}</b><button class="btn" style="margin-left:12px;padding:7px 9px" onclick="state.cart=state.cart.filter(x=>x!=='${g.id}');save();render()">Remove</button></div></div>`).join('')}<div class="total"><span>Total</span><span>$${total.toFixed(2)}</span></div><div class="actions"><button class="btn primary" onclick="state.library=[...new Set([...state.library,...state.cart])];state.cart=[];save();toast('Checkout complete');render()">Mock checkout</button><button class="btn ghost" onclick="nav('home')">Keep browsing</button></div></div>`:`<div style="padding:70px 0"><h2>Your bag is quiet.</h2><p class="muted">Add a game and it will show up here.</p><button class="btn primary" onclick="nav('search')">Browse games</button></div>`}</main>`}
function libraryPage(){let items=state.library.map(get);return `<main class="layout"><div class="pagehead"><div><div class="eyebrow">Your collection</div><h1 class="title" style="font-size:46px">Library</h1></div><span class="sub">${items.length} owned</span></div>${items.length?`<div class="shelf">${items.map(card).join('')}</div>`:`<p class="muted">Your library is empty. The good news: the store is right there.</p>`}</main>`}
function profilePage(){return `<main class="layout"><div class="profile"><aside><div class="avatar">O</div><h2>Ollie</h2><p class="muted">Member since 2024</p></aside><section><div class="eyebrow">Player profile</div><h1 class="title" style="font-size:46px">Make room for good games.</h1><p class="lede">A private little corner for your collection, your notes, and the next thing you want to play.</p><div class="statline"><span><b>${state.library.length}</b>Games owned</span><span><b>46h</b>Playtime</span><span><b>7</b>Reviews</span></div><section class="section"><div class="eyebrow">Account controls</div><div class="cartrow"><div><b>Profile visibility</b><div class="muted">Friends only</div></div><button class="btn">Edit</button></div><div class="cartrow"><div><b>Wishlist digest</b><div class="muted">Every Friday morning</div></div><button class="btn">Edit</button></div></section></section></div></main>`}
function render(){document.querySelector('#app').innerHTML=header()+(state.page==='home'?home():state.page==='search'?searchPage():state.page==='detail'?detailPage():state.page==='cart'?cartPage():state.page==='library'?libraryPage():profilePage())+`<nav class="mobilebar"><button class="${state.page==='home'?'active':''}" onclick="nav('home')">⌂<br>Store</button><button class="${state.page==='search'?'active':''}" onclick="nav('search')">⌕<br>Search</button><button class="${state.page==='library'?'active':''}" onclick="nav('library')">▦<br>Library</button><button class="${state.page==='profile'?'active':''}" onclick="nav('profile')">◯<br>Profile</button></nav>`}render();
</script></body></html>
